<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: beige;
        }
        .card h2 {
            color:blue;
            text-align: center;
            text-decoration: underline;
            text-transform: capitalize;
        }
        .card p {
            color: #666;
            font-size: 14px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Web Development</h2>
        <p>Learn HTML, CSS, and JavaScript to create amazing web applications.</p>
    </div>
    
</body>
</html>
<!-- think of a gift box.
 1. content of the gift box is the content of the card.
 2. the gift box is the card itself.
 3. the gift box has a border, padding, and background color.
 4. the content of the gift box has a heading and a paragraph.
 5. the heading has a color, text alignment, text decoration, and text transform.
 6. the paragraph has a color, font size, and text alignment.
 
 <div class="card"> is used to 
    group the content of the card together and apply the styles defined in the .card class. --!
