<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .block {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
            border: 2px solid #000;
            border-radius: 5px;
        }
        .inline-block {
            display: inline-block;
            width: 100px;
            height: 100px;
            background-color: lightgreen;
            margin: 10px;
            border: 2px solid #000;
            border-radius: 5px;
        }
        .inline{
            display: inline;
    
            background-color: rgb(128, 240, 225);
            margin: 10px;
            border: 2px solid #000;
            border-radius: 5px;
        }
        .none{
            display: none;
    
            background-color: lightcoral;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="block">Box 1</div>
    <div class="block">Box 2</div>
    <div class="inline-block">Inline-Block 1</div>
    <div class="inline-block">Inline-Block 2</div>
</body>
</html>
