<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>

<a href="https://www.google.com" target="_blank">open the google</a>
<img src="https://www.sticckiz.com/products/shinchan-cute-sticker?srsltid=AfmBOopWKEeyekktP0B0jRJZ0pM5dT1BmwvEqgKdzbeIDd_B5uOpCVLt" alt="Shinosuke Nohara" width="500" height="600">
<h1> ORDERED LIST</h1>
<ol>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ol>
<h1> UNORDERED LIST</h1>
<ul>
    <li>milk</li>
    <li>water</li>
    <li>bread</li>
</ul>
<ul>
    <li> Frontend
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </li>
    <li> Backend
        <ul>
            <li>Node.js</li>
            <li>Python</li>
            <li>Java</li>
        </ul>
    </li>
</ul>
    <tr>
        <th> Name</th>
        <th> Age</th>
        <th> City</th>
    </tr>
    <tr>
        <td> John</td>
        <td> 25</td>
        <td> New York</td>
    </tr>
    <tr>
        <td> Jane</td>
        <td> 30</td>
        <td> Los Angeles</td>
    </tr>
    <tr>
        <td> Mike</td>
        <td> 35</td>
        <td> Chicago</td>
    </tr>
</body>
</html>
<!-- href is for the link address(hypertext reference) -->
<!-- target="_blank" opens the link in a new tab -->
 <!-- img tag is used to display an image on the web page -->
  <!-- alt attribute provides alternative text for the image if it cannot be displayed -->
   <!-- width and height attributes specify the dimensions of the image -->
    <!-- ol tag is used to create an ordered list, where each item is numbered -->
     <!-- ul tag is used to create an unordered list, where each item is marked with a bullet point -->
      <!-- li tag is used to define each item in the list -->
