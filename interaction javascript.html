<!DOCTYPE html>
<html lang="en">
<head>
    <title>Javascript syntax</title>
    
</head>
<body>
    <h1>Javascript syntax example</h1>
    <script>
        console.log("Hello World");

        console.log("This is my first javascript code");
        console.log("My name is " + "Ayush");
        console.log(50);
        console.log("Welcome to javascript syntax example");

        let a = 10;
        let b = 20;
        console.log(a + b);
        console.log("The sum of a and b is: " + (a + b));
        var c = 30;
        console.log("The value of c is: " + c);
        const d = 40;
        console.log("The value of d is: " + d);
        //array

        let arr = [1, 2, 3, 4, 5];
        console.log("The array is: " + arr);
        //object
        let student = {
            name: "Ayush",
            age: 17,
            course: "B.Tech"
        };
        console.log("student:", student);  
        let fruits = ["apple", "banana", "mango"];
        console.log("fruits:", fruits);

        console.log("first fruit:",fruits[0]);
        console.log("second fruit:",fruits[1]); 
        console.log("third fruit:",fruits[2]);
        //operators
        let x = 10;
        let y = 5;
        console.log("x + y = " + (x + y));
        console.log("x - y = " + (x - y));
        console.log("x * y = " + (x * y));
        console.log("x / y = " + (x / y)); 
        console.log("x % y = " + (x % y));
        console.log("x==y: " + (x == y));
        console.log("x!=y: " + (x != y));
        console.log("x>y: " + (x > y));
        console.log("x<y: " + (x < y));
        console.log("x>=y: " + (x >= y));
        console.log("x<=y: " + (x <= y));   
        console.log("x===y: " + (x === y));
//logical operators.
        console.log("x>y && x!=y: " + (x > y && x != y));
        console.log("x>y || x!=y: " + (x > y || x != y));
        console.log("!(x>y): " + !(x > y));
        console.log("!(x<y): " + !(x < y));
    </script>
    
</body>
</html>
