<!--Definition of the new line element. This element is used to create a line break in text content.
-->

<p>Hello<br>World</p>

<!--example :
<p>= start of the paragraph
    Hello = first line of text content
    <br> = line break element
    World = second line of text content
</p> = end of the paragraph
The <br> element tells the browser to break the line and continue the text on the next
