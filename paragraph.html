<!-- Definition:
 A paragraph is a block of text that is typically used to group related ideas or information together. It is denoted by the <p> tag in HTML. -->

 <p>Welcome to my Website.</p>
 <!--example :
<p> = start of the paragraph
    Welcome to my Website. = paragraph text content
</p> = end of the paragraph

The <p> tag tells the browser to display the text as a paragraph.
    "This text is a paragraph" -->
